version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - unconvert
  exclusions:
    rules:
      # Tests and test infrastructure launch fixed tools (ssh, ssh-agent, …).
      - path: (_test\.go|internal/testenv/)
        linters: [gosec]
        text: G204
      # Test requests carry plain session cookies on purpose.
      - path: _test\.go
        linters: [gosec]
        text: G124

formatters:
  enable:
    - gofmt
    - goimports

run:
  # Lint the integration tests too (make test runs them with this tag).
  build-tags: [integration]
