# hostbud-e2e — throwaway environment for `make e2e` (docs/ARCHITECTURE.md §13.1).
# Nothing here publishes a port or touches the production `hostbud` project;
# `make e2e` tears it all down (down -v) when it finishes, even on failure.
name: hostbud-e2e

x-app-uid: &app-uid "10001:10001"

services:
  # One-shot: fresh host keys + client key for this run (never committed).
  hostbud-e2e-keygen:
    build: { context: ../sshd, args: { WITH_TMUX: "1" } }
    image: hostbud-e2e-target:local
    container_name: hostbud-e2e-keygen
    entrypoint: ["/usr/local/bin/keygen.sh", "10001"]
    volumes:
      - keys:/keys
      - hostpub:/keys/hostpub
      - agent:/agent

  # The throwaway "host": sshd + tmux + vim + htop, user dev.
  hostbud-e2e-target:
    image: hostbud-e2e-target:local  # built by hostbud-e2e-keygen
    pull_policy: never
    container_name: hostbud-e2e-target
    depends_on:
      hostbud-e2e-keygen: { condition: service_completed_successfully }
    volumes:
      - keys:/keys:ro
      - hostpub:/keys/hostpub

  # Same, without tmux ("tmux missing" scenario).
  hostbud-e2e-target-notmux:
    build: { context: ../sshd, args: { WITH_TMUX: "0" } }
    image: hostbud-e2e-target-notmux:local
    container_name: hostbud-e2e-target-notmux
    depends_on:
      hostbud-e2e-keygen: { condition: service_completed_successfully }
    volumes:
      - keys:/keys:ro

  # ssh-agent holding the client key; the app gets only its socket,
  # mirroring the production agent-socket mount.
  hostbud-e2e-agent:
    image: hostbud-e2e-app:local  # built by hostbud-e2e-app
    pull_policy: never
    container_name: hostbud-e2e-agent
    user: *app-uid
    init: true  # the shell below is PID 1 otherwise and ignores SIGTERM
    depends_on:
      hostbud-e2e-keygen: { condition: service_completed_successfully }
    entrypoint:
      - sh
      - -ec
      - |
        rm -f /run/agent/ssh-agent.sock
        ssh-agent -D -a /run/agent/ssh-agent.sock &
        while [ ! -S /run/agent/ssh-agent.sock ]; do sleep 0.1; done
        SSH_AUTH_SOCK=/run/agent/ssh-agent.sock ssh-add -q /keys/client/id_ed25519
        wait
    healthcheck:
      test: ["CMD", "sh", "-c", "SSH_AUTH_SOCK=/run/agent/ssh-agent.sock ssh-add -l"]
      interval: 1s
      retries: 30
    volumes:
      - keys:/keys:ro
      - agent:/run/agent

  hostbud-e2e-postgres:
    image: postgres:15.13-bookworm
    container_name: hostbud-e2e-postgres
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE, SETGID, SETUID]
    shm_size: 128m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    environment:
      POSTGRES_DB: hostbud
      POSTGRES_USER: hostbud
      POSTGRES_PASSWORD: e2e-placeholder-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB && psql -U $$POSTGRES_USER -d $$POSTGRES_DB -c 'SELECT 1' >/dev/null"]
      start_period: 90s
      interval: 1s
      timeout: 5s
      retries: 60
    volumes:
      - pgdata:/var/lib/postgresql/data

  # The real hostbud image, pointed at the throwaway target.
  hostbud-e2e-app:
    build:
      context: ../..
      args: { HOST_UID: "10001", HOST_GID: "10001", VITE_E2E: "1" }
    image: hostbud-e2e-app:local
    container_name: hostbud-e2e-app
    user: *app-uid
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 1024
    healthcheck:
      test: ["CMD", "hostbud", "healthcheck"]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    depends_on:
      hostbud-e2e-target: { condition: service_healthy }
      hostbud-e2e-agent: { condition: service_healthy }
      hostbud-e2e-postgres: { condition: service_healthy }
      hostbud-e2e-pushfake: { condition: service_healthy }
    environment:
      HOSTBUD_LISTEN: ":8080"
      HOSTBUD_DATA_DIR: /data
      HOSTBUD_POLL_INTERVAL: 1s
      HOSTBUD_LOG_LEVEL: info
      HOSTBUD_LOCAL_PORT: "9055"
      # V2-M1: run hooks on the target reach Caddy's loopback site by name.
      HOSTBUD_HOOK_BASE_URL: http://hostbud-e2e-caddy:9055
      # A short stale window so the stale scenarios finish quickly.
      HOSTBUD_RUN_STALE_AFTER: 10s
      # V2-M3: Web Push to the fake push service. run.sh generates the VAPID
      # pair at e2e-up (.cache/e2e/vapid.env, never committed); without it
      # push is off. The multi app gets no keys (Push unavailable).
      HOSTBUD_VAPID_PUBLIC_KEY: ${E2E_VAPID_PUBLIC_KEY:-}
      HOSTBUD_VAPID_PRIVATE_KEY: ${E2E_VAPID_PRIVATE_KEY:-}
      HOSTBUD_VAPID_SUBJECT: mailto:e2e@example.com
      HOSTBUD_PUSH_TEST_ENDPOINT: http://hostbud-e2e-pushfake:8080/push/
      # Served over HTTPS by hostbud-e2e-caddy (internal CA); Origin allowlist.
      HOSTBUD_DOMAIN: hostbud.example.test
      HOSTBUD_HOST_ADDR: hostbud-e2e-target
      HOSTBUD_HOST_LABEL: E2E target
      HOSTBUD_DB_HOST: hostbud-e2e-postgres
      HOSTBUD_DB_PORT: "5432"
      HOSTBUD_DB_NAME: hostbud
      HOSTBUD_DB_USER: hostbud
      HOSTBUD_DB_PASSWORD: e2e-placeholder-password
      HOSTBUD_DB_SSLMODE: disable
      HOST_SSH_USER: dev
      SSH_AUTH_SOCK: /run/agent/ssh-agent.sock
      # Small, fast throttling so the rate-limit scenarios finish quickly.
      HOSTBUD_LOGIN_MAX_FAILURES: "3"
      HOSTBUD_REGISTER_MAX_FAILURES: "5"
      HOSTBUD_IP_MAX_FAILURES: "6"
      HOSTBUD_LOGIN_BLOCK_BASE: 1s
      HOSTBUD_LOGIN_BLOCK_MAX: 8s
      HOSTBUD_LOGIN_BLOCK_MULTIPLIER: "2"
    volumes:
      - data:/data
      - agent:/run/agent
      - hostpub:/run/host-keys:ro
    networks:
      default:
        # The production Caddyfile proxies to hostbud:8080.
        aliases: [hostbud]


  # A second app on the tmux-less target, served by Caddy on :9056. It shares
  # the database, so the signed-in session works there too.
  hostbud-e2e-app-notmux:
    image: hostbud-e2e-app:local  # built by hostbud-e2e-app
    pull_policy: never
    container_name: hostbud-e2e-app-notmux
    user: *app-uid
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 1024
    healthcheck:
      test: ["CMD", "hostbud", "healthcheck"]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    depends_on:
      hostbud-e2e-target-notmux: { condition: service_healthy }
      hostbud-e2e-app: { condition: service_started }
      hostbud-e2e-agent: { condition: service_healthy }
      hostbud-e2e-postgres: { condition: service_healthy }
    environment:
      HOSTBUD_LISTEN: ":8080"
      HOSTBUD_DATA_DIR: /data
      HOSTBUD_POLL_INTERVAL: 1s
      HOSTBUD_LOG_LEVEL: info
      HOSTBUD_LOCAL_PORT: "9056"
      HOSTBUD_HOST_ADDR: hostbud-e2e-target-notmux
      HOSTBUD_HOST_LABEL: E2E target
      HOSTBUD_DB_HOST: hostbud-e2e-postgres
      HOSTBUD_DB_PORT: "5432"
      HOSTBUD_DB_NAME: hostbud
      HOSTBUD_DB_USER: hostbud
      HOSTBUD_DB_PASSWORD: e2e-placeholder-password
      HOSTBUD_DB_SSLMODE: disable
      HOST_SSH_USER: dev
      SSH_AUTH_SOCK: /run/agent/ssh-agent.sock
      # Small, fast throttling so the rate-limit scenarios finish quickly.
      HOSTBUD_LOGIN_MAX_FAILURES: "3"
      HOSTBUD_REGISTER_MAX_FAILURES: "5"
      HOSTBUD_IP_MAX_FAILURES: "6"
      HOSTBUD_LOGIN_BLOCK_BASE: 1s
      HOSTBUD_LOGIN_BLOCK_MAX: 8s
      HOSTBUD_LOGIN_BLOCK_MULTIPLIER: "2"
    volumes:
      - data-notmux:/data
      - agent:/run/agent
      - hostpub:/run/host-keys:ro

  # V2-M2: its own database for the multi app (the V2-M1 suite keeps the
  # switch-off app and its database). Idempotent, so a persistent stack
  # whose data volume predates it gets the database too.
  hostbud-e2e-multidb:
    image: postgres:15.13-bookworm
    container_name: hostbud-e2e-multidb
    depends_on:
      hostbud-e2e-postgres: { condition: service_healthy }
    environment:
      PGHOST: hostbud-e2e-postgres
      PGUSER: hostbud
      PGPASSWORD: e2e-placeholder-password
      PGDATABASE: hostbud
    entrypoint:
      - sh
      - -ec
      - |
        psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'hostbud_multi'" | grep -q 1 ||
          psql -c 'CREATE DATABASE hostbud_multi'

  # V2-M2: the app with HOSTBUD_PARALLEL_QUEUES=true on the shared target,
  # served by Caddy on :9058, with its own database. Its run hooks reach it
  # through that site.
  hostbud-e2e-app-multi:
    image: hostbud-e2e-app:local  # built by hostbud-e2e-app
    pull_policy: never
    container_name: hostbud-e2e-app-multi
    user: *app-uid
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 1024
    healthcheck:
      test: ["CMD", "hostbud", "healthcheck"]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    depends_on:
      hostbud-e2e-target: { condition: service_healthy }
      hostbud-e2e-app: { condition: service_started }
      hostbud-e2e-agent: { condition: service_healthy }
      hostbud-e2e-multidb: { condition: service_completed_successfully }
    environment:
      HOSTBUD_LISTEN: ":8080"
      HOSTBUD_DATA_DIR: /data
      HOSTBUD_POLL_INTERVAL: 1s
      HOSTBUD_LOG_LEVEL: info
      HOSTBUD_LOCAL_PORT: "9058"
      HOSTBUD_PARALLEL_QUEUES: "true"
      HOSTBUD_HOOK_BASE_URL: http://hostbud-e2e-caddy:9058
      HOSTBUD_RUN_STALE_AFTER: 10s
      HOSTBUD_HOST_ADDR: hostbud-e2e-target
      HOSTBUD_HOST_LABEL: E2E target
      HOSTBUD_DB_HOST: hostbud-e2e-postgres
      HOSTBUD_DB_PORT: "5432"
      HOSTBUD_DB_NAME: hostbud_multi
      HOSTBUD_DB_USER: hostbud
      HOSTBUD_DB_PASSWORD: e2e-placeholder-password
      HOSTBUD_DB_SSLMODE: disable
      HOST_SSH_USER: dev
      SSH_AUTH_SOCK: /run/agent/ssh-agent.sock
      HOSTBUD_LOGIN_MAX_FAILURES: "3"
      HOSTBUD_REGISTER_MAX_FAILURES: "5"
      HOSTBUD_IP_MAX_FAILURES: "6"
      HOSTBUD_LOGIN_BLOCK_BASE: 1s
      HOSTBUD_LOGIN_BLOCK_MAX: 8s
      HOSTBUD_LOGIN_BLOCK_MULTIPLIER: "2"
    volumes:
      - data-multi:/data
      - agent:/run/agent
      - hostpub:/run/host-keys:ro

  # V2-M3: the fake Web Push service (records POSTs, answers as told).
  hostbud-e2e-pushfake:
    build: ./pushfake
    image: hostbud-e2e-pushfake:local
    container_name: hostbud-e2e-pushfake
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 1s
      retries: 30

  hostbud-e2e-tsfake:
    image: node:24.21.0-alpine
    container_name: hostbud-e2e-tsfake
    command: ["node", "/tsfake/server.mjs"]
    volumes:
      - ts:/run/tailscale
      - ./tsfake:/tsfake:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:fs').accessSync('/run/tailscale/tailscaled.sock')"]
      interval: 1s
      retries: 30

  hostbud-e2e-app-ts:
    image: hostbud-e2e-app:local
    pull_policy: never
    container_name: hostbud-e2e-app-ts
    user: *app-uid
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 1024
    healthcheck:
      test: ["CMD", "hostbud", "healthcheck"]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    depends_on:
      hostbud-e2e-app: { condition: service_healthy }
      hostbud-e2e-agent: { condition: service_healthy }
      hostbud-e2e-postgres: { condition: service_healthy }
      hostbud-e2e-tsfake: { condition: service_healthy }
    environment:
      HOSTBUD_LISTEN: ":8080"
      HOSTBUD_DATA_DIR: /data
      HOSTBUD_POLL_INTERVAL: 1s
      HOSTBUD_LOG_LEVEL: info
      HOSTBUD_LOCAL_PORT: "9057"
      HOSTBUD_DOMAIN: hostbud-ts.example.test
      HOSTBUD_HOST_ADDR: hostbud-e2e-target
      HOSTBUD_HOST_LABEL: E2E target
      HOSTBUD_DB_HOST: hostbud-e2e-postgres
      HOSTBUD_DB_PORT: "5432"
      HOSTBUD_DB_NAME: hostbud
      HOSTBUD_DB_USER: hostbud
      HOSTBUD_DB_PASSWORD: e2e-placeholder-password
      HOSTBUD_DB_SSLMODE: disable
      HOST_SSH_USER: dev
      SSH_AUTH_SOCK: /run/agent/ssh-agent.sock
      HOSTBUD_ALLOWED_TS_USERS: allowed@example.com
      TAILSCALED_SOCKET: /run/tailscale/tailscaled.sock
      HOSTBUD_LOGIN_MAX_FAILURES: "3"
      HOSTBUD_REGISTER_MAX_FAILURES: "5"
      HOSTBUD_IP_MAX_FAILURES: "6"
      HOSTBUD_LOGIN_BLOCK_BASE: 1s
      HOSTBUD_LOGIN_BLOCK_MAX: 8s
      HOSTBUD_LOGIN_BLOCK_MULTIPLIER: "2"
    volumes:
      - data-ts:/data
      - agent:/run/agent
      - hostpub:/run/host-keys:ro
      - ts:/run/tailscale:ro
  # The real Caddyfile (loopback-port site); the runner shares its network
  # namespace, so the browser opens http://localhost:9055 like a port forward.
  hostbud-e2e-caddy:
    # The production Caddy image (deploy/caddy/Dockerfile).
    build: { context: ../../deploy/caddy }
    image: hostbud-e2e-caddy:local
    container_name: hostbud-e2e-caddy
    depends_on:
      hostbud-e2e-app: { condition: service_healthy }
      hostbud-e2e-app-notmux: { condition: service_healthy }
      hostbud-e2e-app-ts: { condition: service_healthy }
      hostbud-e2e-app-multi: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    environment:
      HOSTBUD_LOCAL_PORT: "9055"
    # The test domain resolves to this Caddy for the runner, which shares
    # its network namespace (and so its /etc/hosts).
    extra_hosts:
      - hostbud.example.test:127.0.0.1
      - hostbud-ts.example.test:127.0.0.1
    volumes:
      # The production proxy and loopback site, imported unchanged by the e2e
      # Caddyfile (which adds the test domain's HTTPS site and :9056).
      - ../../deploy/caddy/hostbud.caddy:/etc/caddy/hostbud.caddy:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # Failure switches for the runner (restart the app, stop/start sshd) via
  # the Docker socket; fixed commands only (ctl/server.mjs).
  hostbud-e2e-ctl:
    build: ./ctl
    image: hostbud-e2e-ctl:local
    container_name: hostbud-e2e-ctl
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ts:/run/tailscale
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8090/health"]
      interval: 1s
      retries: 30

  # Playwright; idles until run.sh execs `playwright test` into it. Runs as
  # root (the agent accepts root; the keys are root-readable).
  hostbud-e2e-runner:
    build: .
    image: hostbud-e2e-runner:local
    container_name: hostbud-e2e-runner
    init: true
    depends_on: [hostbud-e2e-caddy, hostbud-e2e-ctl]
    network_mode: service:hostbud-e2e-caddy
    environment:
      SSH_AUTH_SOCK: /run/agent/ssh-agent.sock
      CI: "true"
      # The owner's SQL path (allowlist, rate-limit rows) on the disposable DB.
      E2E_DB_URL: postgres://hostbud:e2e-placeholder-password@hostbud-e2e-postgres:5432/hostbud
      # V2-M2: the multi app's own database.
      E2E_DB_MULTI_URL: postgres://hostbud:e2e-placeholder-password@hostbud-e2e-postgres:5432/hostbud_multi
      # Mirrors the app's limits above.
      E2E_LOGIN_MAX_FAILURES: "3"
      E2E_IP_MAX_FAILURES: "6"
    volumes:
      - keys:/keys:ro
      - agent:/run/agent
      - ./results:/e2e/results
      - ./tests:/e2e/tests:ro
      - ./helpers:/e2e/helpers:ro
      - ./playwright.config.ts:/e2e/playwright.config.ts:ro
      - ./global-setup.ts:/e2e/global-setup.ts:ro
      - ./tsconfig.json:/e2e/tsconfig.json:ro
      - ../../internal/api/testdata/routes.json:/e2e/routes.json:ro

networks:
  default:
    name: hostbud-e2e

volumes:
  caddy-data: { name: hostbud-e2e-caddy-data }
  caddy-config: { name: hostbud-e2e-caddy-config }
  keys: { name: hostbud-e2e-keys }
  hostpub: { name: hostbud-e2e-hostpub }
  agent: { name: hostbud-e2e-agent }
  data: { name: hostbud-e2e-data }
  data-notmux: { name: hostbud-e2e-data-notmux }
  pgdata: { name: hostbud-e2e-pgdata }
  ts: { name: hostbud-e2e-ts }
  data-ts: { name: hostbud-e2e-data-ts }
  data-multi: { name: hostbud-e2e-data-multi }
